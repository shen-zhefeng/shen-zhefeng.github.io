        <title>Prototype Sam</title>

            
        <script>
    function toggleDetails(btn) {
        var content = btn.nextElementSibling;
        if (content.style.display === "none") {
            content.style.display = "block";
            btn.classList.add("active");
        } else {
            content.style.display = "none";
            btn.classList.remove("active");
        }
    }

    function closeBox(box) {
        box.style.display = "none";
        var btn = box.previousElementSibling;
        if (btn) btn.classList.remove("active");
    }
</script>

        
        <style>
            :root, body { transition: background-color 0.3s ease, color 0.3s ease; }
        </style>
        
        
        <script>
            // Restore saved light/dark mode preference (runs on every page)
            (function() {
                var saved = localStorage.getItem('color-scheme');
                if (saved === 'light') document.documentElement.classList.add('light-mode');
                if (saved === 'dark') document.documentElement.classList.add('dark-mode');
            })();
        </script>

            <script>
                // 3-click easter egg — toggle light/dark mode (splash page only)
                (function() {
                    var clicks = 0, timer = null;
                    document.addEventListener('click', function(e) {
                        if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON' ||
                            e.target.tagName === 'SUMMARY' || e.target.tagName === 'INPUT') return;
                        clicks++;
                        clearTimeout(timer);
                        if (clicks >= 3) {
                            var html = document.documentElement;
                            if (html.classList.contains('light-mode')) {
                                html.classList.remove('light-mode');
                                html.classList.add('dark-mode');
                                localStorage.setItem('color-scheme', 'dark');
                            } else if (html.classList.contains('dark-mode')) {
                                html.classList.remove('dark-mode');
                                localStorage.removeItem('color-scheme');
                            } else {
                                html.classList.add('light-mode');
                                localStorage.setItem('color-scheme', 'light');
                            }
                            clicks = 0;
                        }
                        timer = setTimeout(function() { clicks = 0; }, 1500);
                    });
                })();
            </script>
