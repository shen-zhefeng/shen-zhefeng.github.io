<span class="inline-toggle" role="button" tabindex="0" onclick="toggleBlock('{{ id }}')" onkeydown="if(event.key==='Enter'||event.key===' ')toggleBlock('{{ id }}')">
    {{ text }}
</span>

<script>
function toggleBlock(id) {
    const el = document.getElementById(id);
    el.style.display = (el.style.display === "block") ? "none" : "block";
}
</script>
