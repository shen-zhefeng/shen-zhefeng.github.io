<div class="expandable-container">
{{header| default(value="")| markdown | safe}}
{% set underline_class = "" %}
{% if underline is defined and not underline %}
    {% set underline_class = " no-underline" %}
{% endif %}
<button class="expandable-trigger{{underline_class}}" onclick="toggleDetails(this)">
    {{ trigger }}
</button>
<div class="expandable-content" style="display: none;" onclick="closeBox(this)">
    {{ body | markdown | safe }}
</div>
</div>
